name: Publish

on:
  push:
    tags:
      - '*/rev-*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'wilksu/dev-tool-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Read pending draft records on retries.
    outputs:
      build: ${{ steps.release.outputs.build }}
      matrix: ${{ steps.release.outputs.matrix }}
      image: ${{ steps.release.outputs.image_name }}
      registry_image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: python3 scripts/owned_release.py prepare --tag "$RELEASE_TAG" --revision "$REVISION" --run-id "$GITHUB_RUN_ID"

  candidate:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      revision: ${{ github.sha }}
      release: true

  publish:
    name: Publish verified OCI content and record delivery intent
    if: always() && needs.prepare.result == 'success' && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    needs: [prepare, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: bash scripts/install_registry_tools.sh
      - id: probe
        name: Resume the original recorded publication if one exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/owned_release.py probe --tag "$RELEASE_TAG" --revision "$REVISION" --run-id "$GITHUB_RUN_ID"
      - if: steps.probe.outputs.needed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-${{ needs.prepare.outputs.image }}-*
          path: ${{ runner.temp }}/candidates
          run-id: ${{ steps.probe.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Upload the tested content without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/owned_release.py publish --tag "$RELEASE_TAG" --revision "$REVISION"
          --run-id "$GITHUB_RUN_ID" --candidates "$RUNNER_TEMP/candidates"
      - name: Authenticate the provenance action to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record GitHub build provenance for the published digest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ needs.prepare.outputs.registry_image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Complete durable release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/owned_release.py finalize --tag "$RELEASE_TAG" --revision "$REVISION"
          --run-id "$GITHUB_RUN_ID" --notification "$RUNNER_TEMP/delivery.json"
      - name: Notify the passive ACR listener with JSON only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record
          path: ${{ runner.temp }}/delivery.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
