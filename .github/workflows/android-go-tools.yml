name: Android Go development image

on:
  push:
    branches:
      - master
      - codex/android-go-tools
    paths:
      - images/android-go-tools/**
      - fixtures/android-go/**
      - .github/workflows/android-go-tools.yml
    tags:
      - 'android-go-tools/rev-*'

permissions:
  contents: read

concurrency:
  group: android-go-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      packages: write
    env:
      BUILDKIT_IMAGE: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      IMAGE: android-go-tools:verification
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
      - name: Build pinned Linux amd64 image
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "android-go-tools/rev-$GITHUB_SHA"
          fi
          python3 images/android-go-tools/build.py --tag "$IMAGE" \
            --oci "$RUNNER_TEMP/android-oci" --revision "$GITHUB_SHA"
      - name: Warm Gradle and build the fixture again with networking disabled
        shell: bash
        run: |
          work="$RUNNER_TEMP/android-fixture"
          cache="$RUNNER_TEMP/android-cache"
          mkdir -p "$work" "$cache"/{home,gradle,go-build,go-mod}
          cp -R fixtures/android-go/. "$work/"
          wrapper="$work/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/gradle/gradle/v9.9.1/gradle/wrapper/gradle-wrapper.jar -o "$wrapper"
          echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  $wrapper" | sha256sum -c -
          options=(--rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges
            --mount "type=bind,src=$work,dst=/workspace"
            --mount "type=bind,src=$cache,dst=/cache"
            -e HOME=/cache/home -e JAVA_TOOL_OPTIONS=-Duser.home=/cache/home
            -e GRADLE_USER_HOME=/cache/gradle -e GOCACHE=/cache/go-build -e GOMODCACHE=/cache/go-mod)
          tasks=(--no-daemon --console=plain --no-build-cache assembleDebug testDebugUnitTest lintDebug)
          docker run "${options[@]}" --network none "$IMAGE" sh /workspace/verify.sh
          docker run "${options[@]}" "$IMAGE" java -cp gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain "${tasks[@]}"
          rm -rf "$work/build" "$work/src/main/jniLibs"
          docker run "${options[@]}" --network none -e GOPROXY=off "$IMAGE" sh -eu -c '
            sh /workspace/verify.sh
            exec java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
          ' verify --offline "${tasks[@]}"
          for abi in arm64-v8a x86_64; do
            apk="$work/build/outputs/apk/debug/android-go-fixture-$abi-debug.apk"
            test -s "$apk"
            test "$(stat -c '%u:%g' "$apk")" = "$(id -u):$(id -g)"
            unzip -Z -1 "$apk" | grep -Fx "lib/$abi/libprobe.so"
          done
      - name: Compare OCI layers after changing only Go or the SDK platform
        if: github.ref_type == 'branch'
        run: >-
          python3 fixtures/android-go/compare-layers.py
          images/android-go-tools/build.py "$RUNNER_TEMP/android-oci"
      - name: Publish the verified OCI manifest to GHCR
        if: github.ref_type == 'tag'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/android-go-tools"
          tag="sha-$GITHUB_SHA"
          layout="$RUNNER_TEMP/android-oci"
          auth="$RUNNER_TEMP/ghcr-auth.json"
          trap 'rm -f "$auth"' EXIT

          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$auth" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --preserve-digests --retry-times 3 --dest-authfile "$auth" \
            --digestfile "$RUNNER_TEMP/android-digest" "oci:$layout" "docker://$image:$tag"
          digest=$(cat "$RUNNER_TEMP/android-digest")
          test "$digest" = "$(jq -er '.manifests[0].digest' "$layout/index.json")"
          alias=$(skopeo inspect --authfile "$auth" --no-tags --format '{{.Digest}}' "docker://$image:$tag")
          test "$digest" = "$alias"
          reference="$image@$digest"
          size=$(jq '[.layers[].size] | add' "$layout/blobs/sha256/${digest#sha256:}")
          printf 'Image: \u0060%s\u0060\n\nCompressed layer bytes: %s\n' "$reference" "$size" | tee -a "$GITHUB_STEP_SUMMARY"
