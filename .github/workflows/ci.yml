name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Machine contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate catalog and image configurations
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path.cwd()
          catalog = json.loads((root / "catalog/v1/images.json").read_text())
          assert catalog["schema"] == 1
          assert catalog["source_repository"] == "wilksu/dev-tool-images"
          assert set(catalog["images"]) == {
              "go-contract-tools",
              "playwright-client-tools",
          }

          digest = re.compile(r"@sha256:[0-9a-f]{64}$")
          exact_npm = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$")
          for name, entry in catalog["images"].items():
              assert entry["registry"] == f"ghcr.io/wilksu/dev-tool-images/{name}"
              assert entry["tag_prefix"] == f"{name}/v"
              config_path = root / entry["config"]
              config = json.loads(config_path.read_text())
              assert config["schema"] == 1
              assert config["name"] == name
              assert config["platforms"] == ["linux/amd64", "linux/arm64"]
              assert all(digest.search(value) for value in config["base_images"].values())
              image_dir = config_path.parent
              package = json.loads((image_dir / "package.json").read_text())
              lock = json.loads((image_dir / config["npm_lock"]).read_text())
              for group in ("dependencies", "devDependencies"):
                  declared = package.get(group, {})
                  assert all(exact_npm.fullmatch(value) for value in declared.values())
                  assert lock["packages"][""] .get(group, {}) == declared
              verifier = image_dir / config["verifier"]
              assert verifier.is_file()
              assert verifier.stat().st_mode & 0o111

          for workflow in (root / ".github/workflows").glob("*.yml"):
              for line in workflow.read_text().splitlines():
                  match = re.search(r"\buses:\s*[^@\s]+@([^\s#]+)", line)
                  if match:
                      assert re.fullmatch(r"[0-9a-f]{40}", match.group(1)), line
          PY

  build-and-verify:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: go-contract-tools
            fixture: contract
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: go-contract-tools
            fixture: contract
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: playwright-client-tools
            fixture: playwright
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: playwright-client-tools
            fixture: playwright
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - id: config
        name: Resolve authoritative build arguments
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          image = os.environ["IMAGE"]
          config = json.loads(pathlib.Path(f"images/{image}/image.json").read_text())
          arguments = []
          for section in ("base_images", "tools", "packages"):
              arguments.extend(
                  f"{key.upper()}={value}"
                  for key, value in config.get(section, {}).items()
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("build_args<<BUILD_ARGS\n")
              output.write("\n".join(arguments))
              output.write("\nBUILD_ARGS\n")
          PY
      - name: Build native image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: dev-tool-images-ci/${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: ${{ steps.config.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Verify native runtime without network or privileges
        env:
          FIXTURE: ${{ matrix.fixture }}
          IMAGE: dev-tool-images-ci/${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            --platform "$PLATFORM" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            "$IMAGE" verify-tool-image "/src/fixtures/$FIXTURE"
