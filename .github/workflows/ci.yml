name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      images:
        description: 'all or comma-separated owned image names (verification only)'
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contracts, pipeline tests and change routing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - run: make check
      - id: plan
        run: python3 scripts/change_plan.py

  build-and-verify:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      revision: ${{ github.sha }}
      release: false

  result:
    name: CI result
    if: always()
    needs: [check, build-and-verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Require contracts and all selected runtime checks
        env:
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build-and-verify.result }}
          EXPECT_BUILD: ${{ needs.check.outputs.build }}
        run: |
          test "$CHECK" = success
          if [ "$EXPECT_BUILD" = true ]; then
            test "$BUILD" = success
          else
            test "$BUILD" = skipped
          fi
