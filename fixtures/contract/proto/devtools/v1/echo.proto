syntax = "proto3";

package devtools.v1;

option go_package = "example.com/dev-tool-images/fixtures/contract/gen/go/devtools/v1;devtoolsv1";

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}
